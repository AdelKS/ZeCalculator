name: Build & Test ZeCalculator on Ubuntu
on:
  workflow_call:
    inputs:
      arch:
        required: true
        type: string

jobs:
  build-test-gcc:
    runs-on: ${{ inputs.arch == 'arm64' && 'ubuntu-26.04-arm' || 'ubuntu-26.04' }}
    steps:
      - name: Checkout ZeCalculator
        uses: actions/checkout@v7

      - name: Install dependencies
        run: sudo apt install meson cmake g++

      - name: Setup meson build folder
        run: meson setup build -D test=true -D b_sanitize=address,undefined

      - name: Compile code
        run: cd build && meson compile

      - name: Test code
        run: cd build && meson test

  build-test-clang:
    runs-on: ${{ inputs.arch == 'arm64' && 'ubuntu-26.04-arm' || 'ubuntu-26.04' }}
    steps:
      - name: Checkout ZeCalculator
        uses: actions/checkout@v7

      - name: Install dependencies
        run: sudo apt install meson cmake clang-22 lld-22 libc++-22-dev

      - name: Setup meson build folder
        run: CXX=clang++-22 CXX_LD=lld-22 meson setup build -D test=true -D b_sanitize=address,undefined -D cpp_args='-pipe -stdlib=libc++ -static-libasan' -D cpp_link_args='-stdlib=libc++ -static-libasan'

      - name: Compile code
        run: cd build && meson compile

      - name: Test code
        run: cd build && meson test
