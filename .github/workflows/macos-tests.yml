name: Build & Test ZeCalculator on macOS
on:
  workflow_call:
    inputs:
      arch:
        required: true
        type: string

jobs:
  build-test:
    runs-on: ${{ inputs.arch == 'arm64' && 'macos-26' || 'macos-26-intel' }}
    steps:
      - name: Checkout ZeCalculator
        uses: actions/checkout@v7

      - name: Install meson
        run: brew install meson

      - name: Setup meson build folder
        run: meson setup build -D test=true -D b_sanitize=address,undefined

      - name: Compile code
        run: cd build && meson compile

      - name: Test code
        run: cd build && meson test
